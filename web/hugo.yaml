# Styrigx 博客（blog.styrigx.com）：Hugo，和主站 styrigx-space 同栈（web/ = 网站本体，hugo --minify -s web → web/public/）。
# 中文是默认语言（不带前缀），英文在 /en/。所有旧地址（Astro 时期）原样保留，见 tests/url-map.json。
title: 'Styrigx'
baseURL: 'https://blog.styrigx.com/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
# 不要 /zh/ 跳转页（旧站没有这个地址，网关也没登记）
disableDefaultLanguageRedirect: true
# 旧站是 Astro 的 trailingSlash: always：/post/<slug>/、/tags/<slug>/
uglyURLs: false
# 文章日期按 UTC 读（Astro 把 2026-10-11 读成 UTC 零点，RSS pubDate 也是 GMT）
timeZone: UTC
enableRobotsTXT: false
enableGitInfo: false
# 只要这些页面：首页、文章、标签页、404、RSS、站点地图（自己的 sitemap-index.xml / sitemap-0.xml）。
# /post/ 与 /tags/ 列表页旧站没有，不生成（否则会多出网关没登记过的页面）。
disableKinds:
  - section
  - taxonomy
  - sitemap

languages:
  zh:
    locale: zh-CN
    label: 中文
    weight: 1
    contentDir: content/zh
    params:
      locale: zh-CN
      rssTitle: 'Styrigx'
  en:
    locale: en
    label: English
    weight: 2
    contentDir: content/en
    params:
      locale: en
      rssTitle: 'Styrigx (English)'

taxonomies:
  tag: tags

permalinks:
  page:
    post: /post/:contentbasename/
  term:
    tags: /tags/:slug/

outputFormats:
  RSS:
    baseName: rss
  SitemapIndex:
    mediaType: application/xml
    baseName: sitemap-index
    isPlainText: true
    notAlternative: true
    root: true
  Sitemap0:
    mediaType: application/xml
    baseName: sitemap-0
    isPlainText: true
    notAlternative: true
    root: true

outputs:
  home: [HTML, RSS, SitemapIndex, Sitemap0]
  page: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github
  highlight:
    # 代码块：Chroma 输出 class（配色由 web/assets/css/blog/code-tokens.css 从色彩角色生成，不用固定主题）
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
    anchorLineNos: false
    guessSyntax: false
    codeFences: true
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

params:
  description: 'Sloan Gray 的个人博客：AI 工具实战、开源项目复盘与个人基础设施笔记。中英双语。'
  pageDescription: 'Sloan Gray（Styrigx）的个人博客：AI 应用、开源项目与基础设施笔记，中英双语更新。'
  author: 'Sloan Gray'
  # 留言板（/guestbook/）：博客、日刻、奇趣三个子站共用同一个 Giscus 讨论串（styrigx/styrigx 仓库 Discussions，Announcements 分类，term = guestbook）。
  # 三个站这段一字不差；改了任何一项就不是同一串留言了。
  # 2026-10-22 起文章页不再有评论（原来按 pathname 存在 styrigx-blog 仓库 Discussions 的 Blog Comments 分类，旧讨论留在那里不动）。
  guestbook:
    giscus:
      repo: 'styrigx/styrigx'
      repoId: 'R_kgDOVDhNiA'
      category: 'Announcements'
      categoryId: 'DIC_kwDOVDhNiM4DJVrs'
      mapping: 'specific'
      term: 'guestbook'
      strict: '0'
      reactionsEnabled: '1'
      emitMetadata: '0'
      inputPosition: 'top'
      lightTheme: 'light'
      darkTheme: 'dark'
      loading: 'lazy'

# 构建时可读的环境变量（CI 用）
security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'

minify:
  # 和主站一样：不压 HTML（tdewolff 与内联脚本里的 < 冲突）；CSS 由 Tailwind CLI 压缩
  disableHTML: true
