[config.site]
title = "Styrigx"
description = "Sloan Gray 的个人博客：AI 工具实战、开源项目复盘与个人基础设施笔记。中英双语。"
pageTitle = "Styrigx | Sloan Gray"
pageDescription = "Sloan Gray（Styrigx）的个人博客：AI 应用、开源项目与基础设施笔记，中英双语更新。"
url = "https://blog.styrigx.com"
repository = "https://github.com/styrigx/styrigx-blog"
footerNote = "Sloan Gray"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# 默认 UI 语言（中文站）。英文页面在代码里按页面语言覆盖。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "LXGW WenKai"
# 中文完整字体文件（主题会自动拼接 -ui-subset.woff2 后缀）
file = "/fonts/LXGWWenKai-Regular.woff2"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = true
provider = "giscus"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索…"
maxResults = 6

[config.pages.blog]
title = "博客"
kicker = "Writing"
subtitle = "拆开看看，再装回去。"
note = "AI 工具实战、开源项目复盘、个人基础设施笔记。"
postsPerPage = 6
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.comments.giscus]
repo = "styrigx/styrigx-blog"
repo_id = "R_kgDOUvdSCg"
category = "Blog Comments"
category_id = "DIC_kwDOUvdSCs4DGjtd"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "bottom"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Sloan Gray"
handle = "@styrigx"
role = "拆开世界是为了看懂它，再把它装回去是为了相信它。"
email = "styrigx@gmail.com"
website = "https://styrigx.com/"
github = "https://github.com/styrigx"
avatar = "/images/avatar.png"

