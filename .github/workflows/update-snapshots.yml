name: Update visual snapshots
# 视觉基线只在 CI 环境生成（与 deploy.yml 同版本 Chromium + Noto CJK），本地生成的字体渲染不一样。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要更新基线的分支（不要填 main）"
        required: true
permissions:
  contents: write
  actions: write # 推完基线后用 GITHUB_TOKEN 触发 deploy.yml
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: echo "不要在 main 上更新基线" && exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install font subsetting tools
        run: python -m pip install --user fonttools brotli
      - run: bun install --frozen-lockfile
      - name: Build site
        run: bun run build
        env:
          SITE_URL: https://blog.styrigx.com
      - name: Install Playwright browsers and CJK fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Update snapshots
        run: npx playwright test --config=playwright.config.js --update-snapshots
      - name: Commit snapshots only
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/blog-visual.spec.js-snapshots
          git diff --cached --quiet && echo "基线无变化" && exit 0
          git diff --cached --stat
          # 只提交截图：跳过 pre-commit（lint-staged 会对全仓跑 format:check，与截图无关）
          git commit --no-verify -m "[UI] CI 更新视觉基线"
          # checkout@v4 传 ref 是 detached HEAD，没有本地分支和 upstream，裸 git push 会失败；用显式 refspec
          git push origin "HEAD:${{ inputs.branch }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN 的 push 不会触发 deploy.yml，这里显式 dispatch 一次（非 main 分支不部署生产）
      - name: Trigger CI on the updated branch
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "${{ inputs.branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
