name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  HUGO_VERSION: 0.168.0

jobs:
  # 作业名保持 build-and-deploy 不变（分支保护的必需检查按这个名字认）
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert zero-key Pages
        # 博客的会话检查全在主站鉴权网关（styrigx-auth-gateway）。本仓库不许有 Pages Functions、
        # 不许出现任何密钥变量名或会话 cookie 验签代码；web/static/_worker.js 只做 pages.dev 跳回。
        run: |
          if [ -e functions ] || [ -e web/static/functions ]; then echo "FAIL: functions/ must not exist (auth lives in the gateway)"; exit 1; fi
          if grep -rn -E "SGX_[A-Z]+_(PUBLIC|PRIVATE|KEY)|sgx-lock-session" web/static web/assets web/layouts --include="*.js" --include="*.mjs" --include="*.ts" --include="*.html"; then
            echo "FAIL: blog must not hold keys or verify sessions"; exit 1
          fi
          echo "OK: zero-key Pages."

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: false

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Tailwind CLI 构建 CSS（scripts/build-css.mjs）→ hugo --minify -s web → web/public/
        run: npm run build

      - name: Search index builds (site:blog)
        # 博客自己写全站搜索索引（styrigx-search-index 读 KV site:blog）：标题 + 描述 + 正文纯文本，private 文章标 private。
        # 每个分支都跑：网址和构建产物对不上 / 0 篇文章 → 红。文件写到 RUNNER_TEMP，不进 web/public（不随 Pages 发出去）。
        run: node scripts/build-search-index.mjs --out "$RUNNER_TEMP/search-index.blog.json"

      - name: Shared shell copy matches lock / main site
        # 共享外壳（主站 styrigx-space web/shared/shell）是唯一来源：副本不许手改，版本要和主站 main 一致
        run: node scripts/sync-shell.mjs --check

      - name: Code token colours are up to date
        run: node scripts/gen-code-tokens.mjs --check

      - name: Unit tests
        # 网址映射 / 订阅 / 锚点 / 网关路由 / 构建 CSS 毛玻璃 / 代码配色对比度 / sgx-ui cookie 继承 / 搜索索引
        run: npm test

      - name: Install Playwright browsers and CJK fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Playwright (behaviour + visual regression)
        run: npm run test:e2e

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/

      - name: Gate check - gateway must already guard blog pages
        # 本站 Pages 没有验票代码，必须先确认网关已经挂在 blog.styrigx.com 上，否则部署后页面不设防。
        # 未登录访问首页必须是网关回的 302（带 X-SGX-Runtime: worker）。不满足就不部署。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://blog.styrigx.com/ | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "blog.styrigx.com/ -> $code runtime=${rt:-none}"
          [ "$code" = "302" ] && [ "$rt" = "worker" ] || { echo "::error::gateway is not guarding blog.styrigx.com yet; deploy the gateway first"; exit 1; }

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.STYRIGX_BLOG_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/public --project-name=styrigx-blog --commit-dirty=true

      - name: Upload search index to KV (site:blog)
        # 和 Pages 部署同一个令牌：STYRIGX_BLOG_PAGES_DEPLOY 需要额外带「Workers KV Storage: Edit」权限。
        # 命名空间 styrigx-search-index（主站 styrigx-space 的搜索 Worker 读它）。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.STYRIGX_BLOG_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: kv key put site:blog --path=${{ runner.temp }}/search-index.blog.json --namespace-id=bd1babcc3fe74d58994e254c74d34ced --remote

      - name: Smoke test - every page directory is behind the gateway
        # 只发不带 cookie 的只读请求。web/public/ 里每个页面所在的一级目录各抽一个页面，未登录必须是网关回的 302；
        # 新增页面目录忘了在网关 wrangler.toml 登记 → 这里红。静态资源（css/ js/ fonts/）不能过网关；pages.dev 不能直接打开。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          ok=0
          probe() { # url 期望状态码 期望runtime(worker|none)
            for i in 1 2 3; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "${rt:-none}" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 runtime=$3"; return 1
          }
          paths=$(cd web/public && find . -name '*.html' ! -name '404.html' | sed 's|^\.||; s|index\.html$||' | awk -F/ '{k=($2==""?"/":$2); if(!(k in s)){s[k]=1; print}}')
          for p in $paths /rss.xml /sitemap-index.xml; do probe "https://blog.styrigx.com$p" 302 worker || ok=1; done
          asset=$(cd web/public && find css -name '*.css' | head -1)
          if [ -n "$asset" ]; then probe "https://blog.styrigx.com/$asset" 200 none || ok=1; else echo "::error::no css/*.css in web/public"; ok=1; fi
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx-blog.pages.dev/ | tr -d '\r' || true)
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "pages.dev / -> $code $loc"
          case "$code $loc" in
            "301 https://blog.styrigx.com/") ;;
            "302 https://styrigx.cloudflareaccess.com/"*) ;;
            *) echo "::error::pages.dev neither redirected nor sat behind Access"; ok=1 ;;
          esac
          exit $ok
