name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Assert no legacy key names
        run: |
          if grep -rn "SGX_ED25519_\|SGX_STEPUP_KEY" --include="*.js" --include="*.ts" --include="*.mjs" functions/ 2>/dev/null; then
            echo "ERROR: Legacy key names found. Use SGX_LOCK_* per key spec v1.0."
            exit 1
          fi
          echo "OK: no legacy key names."
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install font subsetting tools
        run: python -m pip install --user fonttools brotli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run middleware tests
        run: bun run test

      - name: Build site
        run: bun run build
        env:
          SITE_URL: https://blog.styrigx.com

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=styrigx-blog --commit-dirty=true
