name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert zero-key Pages
        # 博客的会话检查全在主站鉴权网关（styrigx-auth-gateway）。本仓库不许有 Pages Functions、
        # 不许出现任何密钥变量名或会话 cookie 验签代码；public/_worker.js 只做 pages.dev 跳回。
        run: |
          if [ -e functions ]; then echo "FAIL: functions/ must not exist (auth lives in the gateway)"; exit 1; fi
          if grep -rn -E "SGX_[A-Z]+_(PUBLIC|PRIVATE|KEY)|sgx-verified" public/ src/ --include="*.js" --include="*.mjs" --include="*.ts"; then
            echo "FAIL: blog must not hold keys or verify sessions"; exit 1
          fi
          echo "OK: zero-key Pages."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install font subsetting tools
        run: python -m pip install --user fonttools brotli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          SITE_URL: https://blog.styrigx.com

      - name: Run middleware tests
        run: bun run test

      - name: Check design tokens sync with main site
        # 博客的 --m-* / --glass-* 必须与主站 @layer tokens 逐项一致，主站是唯一来源
        run: node scripts/check-design-tokens.mjs

      - name: Install Playwright browsers and CJK fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Visual regression tests
        run: npx playwright test --config=playwright.config.js

      - name: Upload visual test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/

      - name: Gate check - gateway must already guard blog pages
        # 本站 Pages 没有验票代码了，必须先确认网关已经挂在 blog.styrigx.com 上，否则部署后页面不设防。
        # 未登录访问首页必须是网关回的 302（带 X-SGX-Runtime: worker）。不满足就不部署。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://blog.styrigx.com/ | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "blog.styrigx.com/ -> $code runtime=${rt:-none}"
          [ "$code" = "302" ] && [ "$rt" = "worker" ] || { echo "::error::gateway is not guarding blog.styrigx.com yet; deploy the gateway first"; exit 1; }

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.STYRIGX_BLOG_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=styrigx-blog --commit-dirty=true

      - name: Smoke test - every page directory is behind the gateway
        # 只发不带 cookie 的只读请求。dist/ 里每个页面所在的一级目录各抽一个页面，未登录必须是网关回的 302；
        # 新增页面目录忘了在网关 wrangler.toml 登记 → 这里红。静态资源不能过网关；pages.dev 不能直接打开。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          ok=0
          probe() { # url 期望状态码 期望runtime(worker|none)
            for i in 1 2 3; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "${rt:-none}" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 runtime=$3"; return 1
          }
          paths=$(cd dist && find . -name '*.html' ! -name '404.html' | sed 's|^\.||; s|index\.html$||' | awk -F/ '{k=($2==""?"/":$2); if(!(k in s)){s[k]=1; print}}')
          for p in $paths /rss.xml /sitemap-index.xml; do probe "https://blog.styrigx.com$p" 302 worker || ok=1; done
          asset=$(cd dist && find _astro -name '*.css' | head -1)
          [ -n "$asset" ] && { probe "https://blog.styrigx.com/$asset" 200 none || ok=1; }
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx-blog.pages.dev/ | tr -d '\r' || true)
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "pages.dev / -> $code $loc"
          case "$code $loc" in
            "301 https://blog.styrigx.com/") ;;
            "302 https://styrigx.cloudflareaccess.com/"*) ;;
            *) echo "::error::pages.dev neither redirected nor sat behind Access"; ok=1 ;;
          esac
          exit $ok
