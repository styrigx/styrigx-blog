name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no legacy key names
        run: |
          # 禁止旧变量名 SGX_ED25519_*（已改名为 SGX_LOCK_*）；不扫描 .github/ 避免自匹配
          if grep -rn "SGX_ED25519_" --include="*.js" --include="*.ts" --include="*.mjs" functions/ 2>/dev/null; then
            echo "ERROR: Found SGX_ED25519_* (use SGX_LOCK_* per key spec v1.0)."
            exit 1
          fi
          echo "OK: no legacy key names."

      - name: Key distribution static check
        # blog 是子站：functions/ 里不得出现任何 *_PRIVATE 或 SGX_STEPUP_*。
        # 私钥只在主站，STEPUP 密钥对只在主站。出现即构建失败。
        run: |
          if grep -rn --include="*.js" -E "_PRIVATE|SGX_STEPUP_" functions/; then
            echo "FAIL: functions/ must not contain *_PRIVATE or SGX_STEPUP_"
            exit 1
          fi
          echo "OK: key distribution check passed."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install font subsetting tools
        run: python -m pip install --user fonttools brotli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run middleware tests
        run: bun run test

      - name: Build site
        run: bun run build
        env:
          SITE_URL: https://blog.styrigx.com

      - name: Install Playwright browsers and CJK fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Visual regression tests
        run: npx playwright test --config=playwright.config.js

      - name: Upload visual test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=styrigx-blog --commit-dirty=true
